[package]
name = "sql2viz"
version = "0.1.0"
edition = "2021"
description = "Transform SQL queries into beautiful visualizations with DuckDB and Iced"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/sql2viz"
keywords = ["duckdb", "visualization", "chart", "gui", "sql"]
categories = ["visualization", "database", "gui"]
readme = "README.md"

[dependencies]
# Core dependencies (always required)
anyhow = "1.0"
duckdb = { version = "1.4", features = ["bundled"] } 
thiserror = "2.0"

# GUI dependencies (optional, enabled with "gui" feature)
iced = { version = "0.13", features = ["canvas"], optional = true } 


[features]
default = []
gui = ["iced"]

[dev-dependencies]
# For testing only
tokio = { version = "1.42", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[package.metadata.docs.rs]
all-features = true