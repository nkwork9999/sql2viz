[package]
name = "flashchart"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A Rust crate for executing DuckDB SQL queries and displaying results in beautiful tables"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/duckdb-table-display"
keywords = ["duckdb", "sql", "table", "cli", "display"]
categories = ["command-line-interface", "database"]

[dependencies]
# DuckDB - 最新版を使用
duckdb = { version = "1.3", features = ["bundled", "chrono", "serde_json"] }

# 表表示ライブラリ (どちらか選択、または両方サポート)
tabled = { version = "0.20", optional = true }
comfy-table = { version = "7.1", optional = true }

# エラーハンドリング
anyhow = "1.0"
thiserror = "2.0"

# シリアライゼーション
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 日時処理
chrono = "0.4"

# CLI機能（オプション）
clap = { version = "4.5", features = ["derive"], optional = true }

# 色付けサポート
colored = { version = "2.1", optional = true }

# CSV/Parquetサポート（オプション）
csv = { version = "1.3", optional = true }
arrow = { version = "54.0", optional = true }

[features]
default = ["tabled-backend", "colored"]
tabled-backend = ["tabled"]
comfy-backend = ["comfy-table"]
all-backends = ["tabled-backend", "comfy-backend"]
cli = ["clap"]
full = ["all-backends", "cli", "colored", "csv", "arrow"]

[dev-dependencies]
tokio = { version = "1.42", features = ["full"] }
criterion = "0.5"
tempfile = "3.15"
pretty_assertions = "1.4"



[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[package.metadata.docs.rs]
all-features = true